[package]
name = "filmcraft-segment-ml"
description = "FilmCraft ML subject segmentation: the SAM 2 / BiRefNet model catalogue, the verified model downloader, and (feature `ml`) subject segmentation over ONNX Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Subject segmentation over ONNX Runtime (SAM 2 object prompts, BiRefNet human matting). Off by
# default and in wasm builds; the ONNX Runtime library ships next to the executable.
ml = []
# Model downloads over HTTPS (pure-Rust TLS: rustls + RustCrypto, OS certificate verification).
download = ["dep:ureq", "dep:rustls", "dep:rustls-rustcrypto", "dep:sha2"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
sha2 = { version = "0.10", optional = true }
